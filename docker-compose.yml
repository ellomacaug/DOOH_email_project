version: "3.8"

services:
  dooh:
    build: .
    image: dooh
    container_name: DOOH
    ports:
      - "7860:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
